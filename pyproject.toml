[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aam-translator"
version = "0.1.1"
description = "Prepare geospatial inputs for the Advanced Acoustic Model (.ELV, .IMP, .INP)"
readme = "README.md"
authors = [
    { name = "Elliott Ruebush" },
]
requires-python = ">=3.12"
dependencies = [
    # Align with NPS-ActiveSpace (numpy==2.3.1); keep upper bound for pip resolution.
    "numpy>=2.2.6,<2.4",
    "rasterio==1.4.3",
    "pyproj==3.7.1",
    "shapely==2.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.16.4",
    "ty==0.0.73",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aam_translator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["docs/**"]
